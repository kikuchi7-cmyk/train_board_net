<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>発車案内</title>
<style>
  :root {
    --bg:#050a0f;--panel:#090f18;--border:#0d2035;--cyan:#00d4ff;
    --orange:#ff7120;--green:#39ff14;--red:#ff2d55;--dim:#3a5a7a;--text:#ddeeff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:60px;}
  header{background:linear-gradient(90deg,#030810,#06122a,#030810);border-bottom:2px solid var(--cyan);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 0 20px rgba(0,200,255,0.2);position:sticky;top:0;z-index:100;}
  .station-name{font-size:1.8rem;font-weight:900;color:var(--cyan);text-shadow:0 0 16px rgba(0,212,255,0.6);letter-spacing:0.05em;}
  .station-sub{font-size:0.75rem;color:var(--dim);margin-top:3px;}
  .clock{font-family:monospace;font-size:1.8rem;color:var(--text);}
  .date{font-size:0.72rem;color:var(--dim);}
  .gps-bar{background:rgba(0,212,255,0.06);border-bottom:1px solid var(--border);padding:7px 16px;font-size:0.72rem;color:var(--dim);display:flex;align-items:center;gap:8px;}
  .gps-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;}
  .gps-dot.active{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  /* 渋谷SSN切替ボタン */
  .ssn-bar{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);}
  .ssn-btn{font-size:0.82rem;padding:6px 16px;border-radius:20px;border:1px solid var(--dim);background:transparent;color:var(--dim);cursor:pointer;width:100%;}
  /* GPS失敗時のみ表示する手動切替 */
  .manual-bar{display:none;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);}
  .manual-bar.visible{display:flex;}
  .m-btn{flex:1;font-size:0.78rem;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;text-align:center;}
  .m-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.08);}
  .trains-section{padding:14px 12px 0;}
  .section-label{font-size:0.7rem;letter-spacing:0.25em;color:var(--dim);border-left:3px solid var(--cyan);padding-left:8px;margin-bottom:12px;}
  .train-card{background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--cyan);border-radius:10px;padding:16px 14px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 14px;align-items:center;}
  .train-card.next{border-left-color:var(--orange);box-shadow:0 0 24px rgba(255,113,32,0.15);}
  .dep-time{font-family:monospace;font-size:3rem;font-weight:700;color:var(--cyan);line-height:1;grid-row:1/3;align-self:center;min-width:120px;}
  .train-card.next .dep-time{color:var(--orange);}
  .destination{font-size:1.5rem;font-weight:700;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:0.75rem;padding:4px 10px;border-radius:3px;font-weight:700;white-space:nowrap;}
  .tag-tokyu{background:rgba(255,113,32,0.12);color:#ffaa44;border:1px solid rgba(255,113,32,0.35);}
  .tag-jr{background:rgba(0,212,255,0.12);color:var(--cyan);border:1px solid rgba(0,212,255,0.35);}
  .tag-cars{background:rgba(255,255,255,0.05);color:#99bbcc;border:1px solid rgba(255,255,255,0.1);}
  .tag-ontime{background:rgba(57,255,20,0.1);color:var(--green);border:1px solid rgba(57,255,20,0.3);}
  .tag-delay{background:rgba(255,45,85,0.12);color:var(--red);border:1px solid rgba(255,45,85,0.35);}
  .tag-rank{background:transparent;color:var(--dim);border:1px solid var(--dim);border-radius:50%;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .train-card.next .tag-rank{color:var(--orange);border-color:var(--orange);}
  .delay-detail{grid-column:1/3;font-size:0.75rem;color:var(--red);background:rgba(255,45,85,0.07);border-radius:4px;padding:5px 10px;margin-top:4px;}
  #status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--cyan);color:#000;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;padding:6px 14px;display:flex;justify-content:space-between;z-index:100;}
  .loading{text-align:center;padding:50px 20px;color:var(--dim);font-size:0.9rem;}
</style>
</head>
<body>
<header>
  <div>
    <div class="station-name" id="h-station">取得中…</div>
    <div class="station-sub" id="h-sub">位置情報を確認しています</div>
  </div>
  <div style="text-align:right">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date-str"></div>
  </div>
</header>

<div class="gps-bar">
  <div class="gps-dot" id="gps-dot"></div>
  <span id="gps-msg">GPS取得中…</span>
</div>

<div class="ssn-bar">
  <button class="ssn-btn" id="ssn-btn" onclick="toggleShibuya()">
    🚃 渋谷発 湘南新宿ライン（大宮方面）を見る
  </button>
</div>

<div class="manual-bar" id="manual-bar">
  <button class="m-btn" onclick="manualSelect('sangenjaya')">三軒茶屋</button>
  <button class="m-btn" onclick="manualSelect('ikejiriohashi')">池尻大橋</button>
  <button class="m-btn" onclick="manualSelect('shibuya')">渋谷</button>
</div>

<div class="trains-section">
  <div class="section-label">次の列車</div>
  <div id="trains-container"><div class="loading">位置情報を取得中…</div></div>
</div>

<div id="status-bar">
  <span id="status-msg">接続中…</span>
  <span id="last-update"></span>
</div>

const RASPI_API = "https://raspberrypi2.tailc9af06.ts.net/miyahara";
const DELAY_HOURS = {start: 18, end: 21}; // 遅延情報を取得する時間帯

let raspiDelayCache = null;
let raspiDelayCacheTs = 0;

async function fetchRaspiDelay() {
  const now = new Date();
  const hour = now.getHours();
  // デバッグ: 時間帯チェック無効化
  // if (hour < DELAY_HOURS.start || hour >= DELAY_HOURS.end) {
  //   return null;
  // }
  // 2分キャッシュ
  if (raspiDelayCache && Date.now() - raspiDelayCacheTs < 120000) {
    return raspiDelayCache;
  }
  try {
    console.log('fetchRaspiDelay: fetching', `${RASPI_API}/api/extra_delays`);
    const r = await fetch(`${RASPI_API}/api/extra_delays`, {signal: AbortSignal.timeout(5000)});
    console.log('fetchRaspiDelay: status', r.status);
    alert('status: ' + r.status + ' ok: ' + r.ok);
    if (r.ok) {
      raspiDelayCache = await r.json();
      raspiDelayCacheTs = Date.now();
      alert('data: ' + JSON.stringify(raspiDelayCache).slice(0,100));
      return raspiDelayCache;
    }
  } catch(e) { console.log('fetchRaspiDelay: error', e); }
  return raspiDelayCache; // エラー時はキャッシュを返す
}

function getDelayForStation(stationId, delayData) {
  if (!delayData) return {on_time: true, delay_text: ''};
  // 三軒茶屋・池尻大橋 → 田園都市線
  if (stationId === 'sangenjaya' || stationId === 'ikejiriohashi') {
    return delayData['田園都市線'] || {on_time: true, delay_text: ''};
  }
  // 渋谷 → 湘南新宿ライン
  if (stationId === 'shibuya') {
    return delayData['湘南新宿ライン'] || {on_time: true, delay_text: ''};
  }
  return {on_time: true, delay_text: ''};
}

  if(lon>=LON_IKE_SHI) return "shibuya";
  if(lon>=LON_SAN_IKE) return "ikejiriohashi";
  return "sangenjaya";
}

function updateManualBtns(){
  document.querySelectorAll('.m-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.textContent.includes(
      currentId==='sangenjaya'?'三軒茶屋':currentId==='ikejiriohashi'?'池尻大橋':'渋谷'
    ));
  });
}

function manualSelect(id){
  manualOverride=true; currentId=id; shibuyaMode=(id==='shibuya');
  updateManualBtns(); renderTrains();
  setTimeout(()=>{manualOverride=false;},180000);
}

let ssnTimeout=null;
function toggleShibuya(){
  const btn=document.getElementById('ssn-btn');
  if(!shibuyaMode){
    savedId=currentId; shibuyaMode=true; manualOverride=true; currentId='shibuya';
    btn.style.borderColor='#ff7120'; btn.style.color='#ff7120';
    btn.textContent='↩ 元の駅に戻る';
    renderTrains();
  } else {
    shibuyaMode=false; manualOverride=false; currentId=savedId||'sangenjaya';
    btn.style.borderColor=''; btn.style.color='';
    btn.textContent='🚃 渋谷発 湘南新宿ライン（大宮方面）を見る';
    renderTrains();
  }
}

function startGPS(){
  if(!navigator.geolocation){
    document.getElementById('gps-msg').textContent='GPS非対応 → 手動で駅を選択';
    document.getElementById('manual-bar').classList.add('visible');
    updateManualBtns(); return;
  }
  navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lon,accuracy}=pos.coords;
    document.getElementById('gps-dot').classList.add('active');
    document.getElementById('gps-msg').textContent=`GPS有効 (精度±${Math.round(accuracy)}m)`;
    document.getElementById('manual-bar').classList.remove('visible');
    if(!manualOverride){
      const detected=detectStation(lat,lon);
      if(detected!==currentId){currentId=detected; renderTrains();}
    }
  },()=>{
    document.getElementById('gps-msg').textContent='GPS取得失敗 → 手動で駅を選択';
    document.getElementById('manual-bar').classList.add('visible');
    updateManualBtns();
  },{enableHighAccuracy:true,maximumAge:15000});
}

async function fetchDelay(railway){
  const now=Date.now();
  if(delayCache[railway]!==undefined&&now-(delayCacheTs[railway]||0)<60000) return delayCache[railway];
  try{
    const url=`https://api.odpt.org/api/4/odpt:TrainInformation?odpt:railway=${encodeURIComponent(railway)}&acl:consumerKey=${ODPT_TOKEN}`;
    const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
    if(!r.ok) return null;
    const data=await r.json();
    let result=null;
    for(const ti of data){
      const txt=ti['odpt:trainInformationText'];
      const ja=txt&&typeof txt==='object'?(txt['ja']||''):(txt||'');
      if(ja.includes('遅延')||ja.includes('遅れ')||ja.includes('運転見合')){result=ja;break;}
    }
    delayCache[railway]=result; delayCacheTs[railway]=now; return result;
  }catch(e){return delayCache[railway]??null;}
}

function getNextTrains(id){
  const now=new Date();
  const isHoliday=[0,6].includes(now.getDay());
  const tt=TIMETABLE[id][isHoliday?'holiday':'weekday'];
  const nowMin=now.getHours()*60+now.getMinutes();
  const result=[];
  for(const[h,m,dest]of tt){
    if(h*60+m<nowMin-1) continue;
    result.push({time:`${String(h%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`,dest});
    if(result.length===6) break;
  }
  return result;
}

async function renderTrains(){
  const st=STATIONS[currentId];
  document.getElementById('h-station').textContent=st.name;
  document.getElementById('h-sub').textContent=st.sub;
  const trains=getNextTrains(currentId);
  const container=document.getElementById('trains-container');
  if(!trains.length){container.innerHTML='<div class="loading">本日の運行は終了しました</div>';return;}
  // ラズパイAPIから遅延情報取得（18-21時のみ）
  const raspiDelay = await fetchRaspiDelay();
  const stationDelay = getDelayForStation(currentId, raspiDelay);
  const hasDelay = !stationDelay.on_time;
  const delayText = stationDelay.delay_text;
  container.innerHTML='';
  trains.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className=`train-card${i===0?' next':''}`;
    div.innerHTML=`
      <div class="dep-time">${t.time}</div>
      <div class="destination">▶ ${t.dest}</div>
      <div class="tags">
        <span class="tag ${st.lineTag}">${st.lineLabel}</span>
        ${hasDelay?`<span class="tag tag-delay">⚠ 遅延</span>`:`<span class="tag tag-ontime">✓ 定刻</span>`}
        <span class="tag tag-rank">${i+1}</span>
      </div>
      ${hasDelay&&i===0?`<div class="delay-detail">⚠ ${delayText.slice(0,80)}</div>`:''}
    `;
    container.appendChild(div);
  });
  const now=new Date(),p=v=>String(v).padStart(2,'0');
  document.getElementById('status-msg').textContent=`● LIVE  ${st.name}`;
  document.getElementById('last-update').textContent=`更新 ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
}

function updateClock(){
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  document.getElementById('clock').textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;
  const days=['日','月','火','水','木','金','土'];
  document.getElementById('date-str').textContent=`${n.getMonth()+1}/${n.getDate()}(${days[n.getDay()]})`;
}

updateClock(); setInterval(updateClock,1000);
renderTrains(); setInterval(renderTrains,30000);
startGPS();
</script>
